<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kaaraange Pay — le paiement sécurisé sur Bitcoin Lightning pour acheter et vendre sur WhatsApp, TikTok et Instagram sans risque d'arnaque." />
    <meta name="theme-color" content="#0A7A42" />
    <title>Kaaraange Pay — Achetez en ligne sans risque</title>
    <script>
      // Applique le thème avant l'affichage pour éviter le flash blanc
      try {
        var t = localStorage.getItem('kp-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
